/* Layout: desktop = fixed left rail + reading column; phone = top bar + bottom tab bar. Test mode = exam-style chrome only. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --sunk:#e8ecf1; --ink:#131a23; --muted:#576271; --line:#d6dce4; --line-strong:#b9c2ce;
  --gre:#2a4bc0; --gre-soft:#e5eafb; --ielts:#a31f2b; --ielts-soft:#f8e6e7;
  --ok:#1b7647; --ok-soft:#e2f2e8; --bad:#b3261e; --bad-soft:#fbe8e6; --mark:#9a5b00; --mark-soft:#fcefd9;
  --on-accent:#ffffff; --calc-body:#d9dde3; --calc-key:#f7f8fa; --calc-disp:#ffffff;
  --accent:var(--gre); --accent-soft:var(--gre-soft);
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-ui:"IBM Plex Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-read:"Source Serif 4", Georgia, "Times New Roman", serif;
  --f-mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:12px; --r-sm:8px;
  --tab-h:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d1218; --surface:#151c25; --sunk:#1c2530; --ink:#e6ebf1; --muted:#98a3b1; --line:#29333f; --line-strong:#3c4856;
  --gre:#93a9ff; --gre-soft:#1b2448; --ielts:#ff8d96; --ielts-soft:#3a1b20;
  --ok:#62d398; --ok-soft:#14301f; --bad:#ff8c82; --bad-soft:#3a1916; --mark:#f2b45c; --mark-soft:#372811;
  --on-accent:#0d1218; --calc-body:#2a323d; --calc-key:#3a4450; --calc-disp:#0f141a;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0d1218; --surface:#151c25; --sunk:#1c2530; --ink:#e6ebf1; --muted:#98a3b1; --line:#29333f; --line-strong:#3c4856;
  --gre:#93a9ff; --gre-soft:#1b2448; --ielts:#ff8d96; --ielts-soft:#3a1b20;
  --ok:#62d398; --ok-soft:#14301f; --bad:#ff8c82; --bad-soft:#3a1916; --mark:#f2b45c; --mark-soft:#372811;
  --on-accent:#0d1218; --calc-body:#2a323d; --calc-key:#3a4450; --calc-disp:#0f141a;
  color-scheme:dark; }
body[data-exam="ielts"]{ --accent:var(--ielts); --accent-soft:var(--ielts-soft); }

*{box-sizing:border-box}
[hidden]{display:none !important}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:15px/1.55 var(--f-ui); -webkit-font-smoothing:antialiased; -webkit-tap-highlight-color:transparent}
a{color:var(--accent)}
button,input,textarea,select{font:inherit; color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent); outline-offset:2px}
h1,h2,h3{font-family:var(--f-display); text-wrap:balance; line-height:1.15; margin:0}
h1{font-size:clamp(1.7rem, 4vw, 2.35rem); font-weight:700; letter-spacing:-.01em}
h2{font-size:1.3rem; font-weight:700}
h3{font-size:1.06rem; font-weight:700}
p{margin:0}
.small{font-size:.85rem; color:var(--muted)}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem; letter-spacing:.09em; text-transform:uppercase; font-weight:600; color:var(--accent)}
.num,.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{min-height:100%; display:grid; grid-template-columns:252px minmax(0,1fr)}
.side{position:sticky; top:0; height:100vh; height:100dvh; overflow:auto; background:var(--surface); border-right:1px solid var(--line); padding:20px 14px calc(20px + env(safe-area-inset-bottom,0px)) max(14px, env(safe-area-inset-left,0px)); display:flex; flex-direction:column; gap:18px}
.brand{display:flex; align-items:center; gap:10px; padding:0 6px; text-decoration:none; color:var(--ink)}
.brand-mark{width:34px; height:34px; border-radius:9px; background:var(--accent); color:var(--on-accent); display:grid; place-items:center; font:700 .82rem/1 var(--f-display); letter-spacing:.02em}
.brand-name{font:700 1.02rem/1.1 var(--f-display)}
.brand-sub{font-size:.72rem; color:var(--muted)}
.brand-logo{width:38px; height:38px; object-fit:contain; border-radius:9px; flex:none}
.credit{font-size:.75rem; color:var(--muted); line-height:1.45; margin:0}
.credit span{user-select:all; word-break:break-all}
.social{display:flex; gap:8px; flex-wrap:wrap}
.social a{display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border:1px solid var(--line); border-radius:999px; text-decoration:none; color:var(--ink); font-size:.8rem; background:var(--surface)}
.social a:hover{border-color:var(--accent); color:var(--accent)}
.social svg{width:15px; height:15px; fill:currentColor; flex:none}
.side-foot .social a{padding:4px 8px}
.site-foot{margin-top:40px; padding-top:16px; border-top:1px solid var(--line); font-size:.8rem; color:var(--muted); display:flex; flex-wrap:wrap; gap:6px 16px; justify-content:space-between}
.seg{display:grid; grid-template-columns:1fr 1fr; background:var(--sunk); border-radius:10px; padding:3px; gap:3px}
.seg button{border:0; background:transparent; padding:7px 8px; border-radius:8px; font-weight:600; font-size:.88rem; color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.12)}
.seg button[data-exam="gre"][aria-pressed="true"]{color:var(--gre)}
.seg button[data-exam="ielts"][aria-pressed="true"]{color:var(--ielts)}
.nav{display:flex; flex-direction:column; gap:2px}
.nav-h{font-size:.7rem; letter-spacing:.09em; text-transform:uppercase; color:var(--muted); font-weight:600; padding:12px 10px 4px}
.nav a{display:flex; align-items:center; gap:11px; padding:8px 10px; border-radius:8px; text-decoration:none; color:var(--ink); font-weight:500; font-size:.93rem}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="page"]{background:var(--accent-soft); color:var(--accent)}

.startrow{display:grid; grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr)); gap:14px}

.timer{font:500 1rem/1 var(--f-mono); padding:6px 10px; border-radius:8px; background:rgba(127,127,127,.22); min-width:72px; text-align:center; font-variant-numeric:tabular-nums}
.timer.low{background:var(--bad); color:#fff}
.tfoot{position:fixed; left:0; right:0; bottom:0; z-index:8; background:var(--surface); border-top:1px solid var(--line); display:flex; gap:10px; justify-content:space-between; align-items:center; padding:10px max(16px, env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px, env(safe-area-inset-left,0px))}
.rgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr)); gap:8px}
.rcell{border:1.5px solid var(--line); border-radius:var(--r-sm); padding:10px; background:var(--surface); text-align:left; display:flex; flex-direction:column; gap:3px}
.rcell b{font:600 .95rem/1 var(--f-mono)}
.rcell span{font-size:.75rem; color:var(--muted)}
.rcell.ans{border-color:var(--accent)}
.rcell.mk{background:var(--mark-soft); border-color:var(--mark)}
.rcell.cur{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex; flex-wrap:wrap; gap:14px; font-size:.8rem; color:var(--muted)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; border:1.5px solid var(--line); vertical-align:-1px; margin-right:5px}
.legend i.ans{border-color:var(--accent)} .legend i.mk{background:var(--mark-soft); border-color:var(--mark)}
.testlist{display:grid; gap:12px}
.tcard{display:grid; grid-template-columns:minmax(0,1fr) auto; gap:6px 16px; align-items:center}
.tcard .btn{grid-row:1 / span 3; grid-column:2}
.tcard .meta{display:flex; flex-wrap:wrap; gap:6px}
@media (max-width:560px){ .tcard{grid-template-columns:minmax(0,1fr)} .tcard .btn{grid-row:auto; grid-column:auto; justify-self:start} }
.editor{width:100%; min-height:46vh; padding:16px; border:1.5px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface); font:1rem/1.65 var(--f-read); resize:vertical}
.ed-tools{display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:space-between; margin-bottom:8px}
.wc{font:500 .9rem/1 var(--f-mono)}
.wc.under{color:var(--bad)}
.prompt{font-family:var(--f-read); font-size:1.08rem; line-height:1.6; background:var(--sunk); border-radius:var(--r-sm); padding:14px 16px}
.chart-box{background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:12px; overflow-x:auto}
.chart-box svg{display:block; width:100%; height:auto}
.cue{border:2px solid var(--ink); border-radius:var(--r-sm); padding:18px 20px; background:var(--surface); font-family:var(--f-read); font-size:1.08rem}
.cue ul{margin:8px 0 0}
.bigtime{font:500 clamp(2.4rem,9vw,3.6rem)/1 var(--f-mono); font-variant-numeric:tabular-nums}
.checklist{display:grid; gap:8px}
.checklist label{display:flex; gap:10px; align-items:flex-start; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm); padding:10px 12px}
.checklist input{width:18px; height:18px; margin-top:2px; accent-color:var(--accent)}
.model{font-family:var(--f-read); line-height:1.7}
.model p + p{margin-top:10px}

/* ---------- vocab ---------- */
.tabs{display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto}
.tabs button{border:0; background:none; padding:10px 14px; font-weight:600; color:var(--muted); border-bottom:2.5px solid transparent; margin-bottom:-1px; white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--accent); border-color:var(--accent)}
.filters{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:14px}
.search{width:100%; max-width:360px; padding:9px 12px; border:1.5px solid var(--line-strong); border-radius:var(--r-sm); background:var(--surface); margin-bottom:12px; min-height:44px}
.words{display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr)); gap:12px}
.word{display:flex; flex-direction:column; gap:8px}
.word-h{display:flex; align-items:baseline; gap:8px; flex-wrap:wrap}
.word-h b{font:700 1.3rem/1.1 var(--f-display)}
.word-h i{color:var(--muted); font-size:.85rem}
.word .def{font-weight:500}
.word .ex{font-family:var(--f-read); margin:0; padding-left:18px; color:var(--ink)}
.word .ex li + li{margin-top:4px}
.word .syn{font-size:.85rem; color:var(--muted)}
.word .tipline{font-size:.83rem; background:var(--sunk); border-radius:6px; padding:6px 9px}
.word-foot{display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:4px}
.known{border:1px solid var(--line); background:transparent; border-radius:999px; padding:4px 11px; font-size:.8rem; color:var(--muted)}
.known[aria-pressed="true"]{background:var(--ok); border-color:var(--ok); color:#fff}
.flash{max-width:560px; margin:0 auto; display:grid; gap:14px}
.flashcard{min-height:260px; border:1px solid var(--line); background:var(--surface); border-radius:16px; padding:28px 24px; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; gap:10px; width:100%}
.flashcard .fw{font:700 clamp(1.8rem,7vw,2.6rem)/1.1 var(--f-display)}
.flashcard.back{align-items:flex-start; text-align:left}

/* ---------- calculator (ETS style) ---------- */
.calc{position:fixed; z-index:40; top:120px; right:24px; width:268px; background:var(--calc-body); border:1px solid var(--line-strong); border-radius:10px; box-shadow:0 12px 32px rgba(0,0,0,.28); user-select:none; touch-action:none}
.calc-h{display:flex; align-items:center; justify-content:space-between; padding:6px 8px 6px 12px; font-size:.82rem; font-weight:600; cursor:move; border-bottom:1px solid var(--line-strong)}
.calc-h button{border:0; background:transparent; font-size:1.2rem; line-height:1; width:32px; height:32px; border-radius:6px}
.calc-h button:hover{background:rgba(127,127,127,.25)}
.calc-b{padding:10px; display:grid; gap:8px}
.calc-d{display:flex; align-items:center; gap:6px; background:var(--calc-disp); border:1px solid var(--line-strong); border-radius:4px; padding:8px 10px; height:46px}
.calc-d .m{font:600 .8rem/1 var(--f-mono); width:14px; color:var(--muted)}
.calc-d .v{flex:1; text-align:right; font:500 1.45rem/1 var(--f-mono); letter-spacing:.02em; overflow:hidden; white-space:nowrap}
.calc-k{display:grid; grid-template-columns:repeat(5,1fr); gap:5px}
.calc-k button{height:40px; border:1px solid var(--line-strong); background:var(--calc-key); border-radius:5px; font:500 .95rem/1 var(--f-mono); color:var(--ink); padding:0}
.calc-k button:active{transform:translateY(1px)}
.calc-k button.op{font-weight:600}
.calc-t{height:38px; border:1px solid var(--line-strong); background:var(--calc-key); border-radius:5px; font-size:.85rem; font-weight:600}
.calc-t[disabled]{opacity:.45}
@media (max-width:640px){
  .calc{left:0 !important; right:0 !important; top:auto !important; bottom:calc(64px + env(safe-area-inset-bottom,0px)); width:auto; border-radius:14px 14px 0 0; box-shadow:0 -8px 24px rgba(0,0,0,.25); padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px)}
  .calc-h{cursor:default}
  .calc-k button{height:40px}
  .calc-b{padding:8px; gap:6px}
}


/* ---------- image questions & official pages ---------- */
.qimg{background:#fff; border:1px solid var(--line); border-radius:var(--r-sm); overflow-x:auto; margin-top:4px}
.qimg img{display:block; width:100%; max-width:100%; height:auto}
.qimg.loading{display:grid; place-items:center; min-height:200px; max-width:100%}
body.zoom .qimg img{width:1100px; max-width:none}
.lgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:8px; margin-top:12px; max-width:560px}
.lopt{height:52px; border:1.5px solid var(--line-strong); background:var(--surface); border-radius:10px; font:600 1.05rem/1 var(--f-mono)}
.lopt.sq{border-radius:6px}
.lopt:hover:not([disabled]){background:var(--sunk)}
.lopt.sel{background:var(--accent); border-color:var(--accent); color:var(--on-accent)}
.lopt.ok{background:var(--ok); border-color:var(--ok); color:#fff}
.lopt.bad{background:var(--bad); border-color:var(--bad); color:#fff}
.pages{display:grid; gap:14px}
.page{margin:0; background:#fff; border:1px solid var(--line); border-radius:var(--r-sm); overflow-x:auto}
.page img{display:block; width:100%; max-width:820px; height:auto; margin:0 auto}
body.zoom .page img{width:1000px; max-width:none}
.page figcaption{font-size:.75rem; color:#5d6672; text-align:center; padding:4px 0 8px; background:#fff}
.kgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(64px,1fr)); gap:6px}
.kcell{border:1.5px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 4px; display:flex; flex-direction:column; align-items:center; gap:2px}
.kcell b{font:600 1rem/1 var(--f-mono)}
.kcell span{font-size:.68rem; color:var(--muted); font-variant-numeric:tabular-nums}
.kcell:hover{border-color:var(--accent)}
.kcell.part{border-color:var(--accent); background:var(--accent-soft)}
.kcell.full{border-color:var(--ok); background:var(--ok-soft)}

/* ---------- pronunciation & big lists ---------- */
.say{width:34px; height:34px; border-radius:50%; border:1px solid var(--line-strong); background:var(--surface); color:var(--accent); display:inline-grid; place-items:center; flex:none; padding:0}
.say:hover{background:var(--accent-soft)}
.say.sm{width:28px; height:28px; vertical-align:middle}
.say .ico{width:17px; height:17px}
.pr{font:500 .82rem/1 var(--f-mono); color:var(--muted)}
.alpha{display:flex; flex-wrap:wrap; gap:4px; margin-bottom:10px}
.alpha .chip{padding:4px 9px; min-width:32px; justify-content:center}
.more-row{grid-column:1 / -1; display:flex; justify-content:center; padding:8px 0}
.flashcard .fc-face{border:0; background:transparent; display:flex; flex-direction:column; align-items:center; gap:10px; width:100%; padding:10px}

.modal{position:fixed; inset:0; z-index:50; background:rgba(8,12,18,.55); display:grid; place-items:center; padding:20px}
.modal .card{max-width:440px; width:100%; display:grid; gap:14px}

@media (prefers-reduced-motion: reduce){ *{scroll-behavior:auto !important; transition:none !important; animation:none !important} }
</style>
